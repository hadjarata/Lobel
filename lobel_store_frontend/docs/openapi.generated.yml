        description: 8 à 15 chiffres au format international, sans +, espace ni tiret.
        type: string
        maxLength: 15
        minLength: 1
      whatsapp_message:
        title: Whatsapp message
        description: 'Message générique uniquement : aucune donnée personnelle.'
        type: string
        maxLength: 1000
        minLength: 1
      button_label:
        title: Button label
        type: string
        maxLength: 80
        minLength: 1
      availability_text:
        title: Availability text
        type: string
        maxLength: 240
      response_time_text:
